<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR · Líneas Eléctricas Chile</title><style>html,body{margin:0;height:100%;font-family:Arial;background:#071827;color:#fff}.top{padding:10px;background:#071827}.top a{color:#fff}.controls{display:flex;gap:7px;flex-wrap:wrap;padding:8px}.controls select,.controls button{padding:9px;border-radius:9px;border:0}model-viewer{width:100%;height:calc(100% - 130px);background:linear-gradient(#9fc4d3,#d8e4df)}.note{font-size:12px;color:#ffd69a}</style><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script></head><body><div class="top"><a href="./index.html">← Volver</a><h2>Realidad aumentada de colocación</h2><div class="note">Android: GLB mediante Scene Viewer/WebXR. iPad: para Quick Look se necesita una versión USDZ del modelo.</div></div><div class="controls"><select id="model"></select><button id="arButton">Activar AR</button></div><model-viewer id="viewer" camera-controls touch-action="pan-y" shadow-intensity="1" ar ar-modes="webxr scene-viewer quick-look" environment-image="neutral"></model-viewer><script type="module">const c=await fetch('./config/model-catalog.json').then(r=>r.json()),s=document.getElementById('model'),v=document.getElementById('viewer');for(const m of c.models){const o=document.createElement('option');o.value=m.file;o.textContent=m.label;s.appendChild(o)}function set(){v.src=s.value}set();s.onchange=set;document.getElementById('arButton').onclick=()=>v.activateAR();</script></body></html>
