<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Líneas Eléctricas Chile 3D/AR</title><meta name="theme-color" content="#071827"><meta name="author" content="Wladimir Campos - www.JFSasesorias.org"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./assets/icon.svg"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="./css/app.css"></head><body>
<div id="errorBanner" class="error-banner"></div><div id="map"></div>
<header class="brand"><strong>Líneas Eléctricas Chile 3D/AR</strong><span>Proyecto exclusivo para Chile · Creado por Wladimir Campos · www.JFSasesorias.org</span></header>
<section id="radar" class="radar hidden"><div class="radar-face"><div id="radarArrow" class="radar-arrow">➤</div></div><strong id="radarName">Sin objetivo</strong><small id="radarData">--</small></section>
<section id="panel" class="panel"><h2>Inicializando</h2><div class="row">Cargando módulos…</div></section>
<section class="dock"><div class="button-row"><button id="gpsBtn" class="btn primary">GPS</button><button id="officialBtn" class="btn">Datos Chile</button><button id="osmBtn" class="btn">OSM zona</button><button id="measureBtn" class="btn">Medir</button><button id="clearMeasureBtn" class="btn">Borrar medida</button><button id="radarBtn" class="btn">Radar</button><button id="viewer3dBtn" class="btn">Laboratorio 3D</button><button id="arBtn" class="btn">AR</button><button id="layersBtn" class="btn">Capas</button><button id="installBtn" class="btn">Instalar</button><button id="diagnosticBtn" class="btn">Diagnóstico</button></div><div class="settings"><label class="setting">Radio GPS (m)<input id="radiusInput" type="number" min="20" step="10" value="250"></label><label class="setting">Radar<select id="radarMode"><option value="nearest">Más cercano</option><option value="line">Línea</option><option value="substation">Subestación</option><option value="wind">Eólico</option><option value="solar">Solar</option></select></label><label class="setting">OSM alrededor<select id="osmRadius"><option value="3000">3 km</option><option value="10000" selected>10 km</option><option value="30000">30 km</option></select></label></div></section>
<div id="layersModal" class="modal hidden"><div class="modal-head"><h2>Capas y almacenamiento</h2><button id="closeLayers" class="btn">Cerrar</button></div><div id="layerCards" class="layer-list"></div><div class="modal-actions"><button id="clearDbBtn" class="btn">Limpiar datos guardados</button></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.3.5/turf.min.js"></script><script type="module" src="./js/app.js"></script></body></html>
