<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico</title><style>body{font-family:Arial;margin:20px;background:#eef3f5}table{border-collapse:collapse;width:100%;background:#fff}td,th{padding:8px;border:1px solid #ccd} .ok{color:green}.bad{color:#a00}</style></head><body><a href="./index.html">← Volver</a><h1>Diagnóstico del proyecto</h1><table><thead><tr><th>Prueba</th><th>Resultado</th></tr></thead><tbody id="rows"></tbody></table><script>const tests=[];const add=(n,v,d='')=>tests.push([n,v,d]);add('HTTPS / contexto seguro',isSecureContext,location.protocol);add('Geolocalización',!!navigator.geolocation);add('IndexedDB',!!window.indexedDB);add('Service Worker','serviceWorker'in navigator);add('WebGL',(()=>{try{return!!document.createElement('canvas').getContext('webgl2')}catch{return false}})());add('Orientación/brújula','DeviceOrientationEvent'in window);Promise.all(['./config/model-catalog.json','./models/towers/torre_3fases_1cg.glb','./models/towers/torre_6fases_a.glb','./models/towers/torre_6fases_b.glb','./models/wind/aerogenerador.glb'].map(async u=>{try{const r=await fetch(u,{method:'HEAD'});add('Archivo '+u,r.ok,r.status)}catch(e){add('Archivo '+u,false,e.message)}})).then(()=>{document.getElementById('rows').innerHTML=tests.map(([n,v,d])=>`<tr><td>${n}</td><td class="${v?'ok':'bad'}">${v?'OK':'FALLA'} ${d||''}</td></tr>`).join('')});</script></body></html>
